<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>강사 스케줄 - 원어민 강사 출강 관리</title>
<link rel="stylesheet" href="style.css">
<script src="common.js"></script>
</head>
<body>
<div id="page-wrap">
  <div id="head_bar_root"></div>

  <div class="panel">
    <a href="teachers.html" class="back-link">← 강사 리스트로 돌아가기</a>
    <div id="profile_holder"></div>
  </div>

  <div class="panel" style="margin-top:20px;">
    <h3>주간 출강 스케줄 (승인 완료 기준)</h3>
    <span id="hour_chip" class="hour-chip" style="display:none;"></span>
    <div id="grid_holder" class="grid-wrap" style="margin-top:10px;"></div>
  </div>

  <div class="panel" style="margin-top:20px;">
    <h3>대기 중인 요청 (이 강사 관련)</h3>
    <div id="pending_holder"></div>
  </div>

  <div class="panel" style="margin-top:20px;">
    <h3>휴가 / 병가 이력</h3>
    <div id="leave_holder"></div>
  </div>
</div>

<script>
  const me = requireStaff();
  const params = new URLSearchParams(location.search);
  const teacherId = params.get("id");

  function init() {
    if (!me) return;
    renderHeadBar("teachers");
    const teacher = getTeachers().find(t => t.id === teacherId);
    if (!teacher) {
      document.getElementById("profile_holder").innerHTML = `<p class="small-muted">강사를 찾을 수 없습니다.</p>`;
      return;
    }
    renderProfile(teacher);
    renderTeacherGrid(teacherId, document.getElementById("grid_holder"), document.getElementById("hour_chip"));
    renderPending(teacher);
    renderLeaves(teacher);
  }

  function renderProfile(t) {
    const photoHtml = t.photo ? `<img src="${t.photo}" style="width:110px;height:110px;border-radius:12px;object-fit:cover;">`
      : `<div style="width:110px;height:110px;border-radius:12px;background:#f1f5f9;display:flex;align-items:center;justify-content:center;color:#94a3b8;font-size:12px;">사진 없음</div>`;
    document.getElementById("profile_holder").innerHTML = `
      <div style="display:flex; gap:18px; align-items:flex-start; flex-wrap:wrap;">
        ${photoHtml}
        <div>
          <h3 style="margin-bottom:8px;">${escapeHtml(t.name)} ${t.visa ? `<span class="visa-badge">${escapeHtml(t.visa)}</span>` : ""} ${t.status === "퇴사" ? `<span class="visa-badge" style="background:#fee2e2;color:#dc2626;">퇴사</span>` : ""}</div>
          <div class="meta">🏠 ${escapeHtml(t.location || "미등록")}</div>
          <div class="meta">☎ ${escapeHtml(t.phone || "미등록")}</div>
          <div class="meta">입사일: ${escapeHtml(t.hireDate || "미등록")}${t.resignDate ? " · 퇴사일: " + escapeHtml(t.resignDate) : ""}</div>
        </div>
      </div>
    `;
  }

  function renderPending(t) {
    const pending = getSchedules().filter(s => s.teacherId === t.id && s.status === "대기");
    const holder = document.getElementById("pending_holder");
    if (pending.length === 0) { holder.innerHTML = `<p class="small-muted">대기 중인 요청이 없습니다.</p>`; return; }
    holder.innerHTML = `<table class="data-table"><thead><tr><th>어린이집</th><th>일정</th><th>요청자</th></tr></thead><tbody>` +
      pending.map(s => `<tr><td>${escapeHtml(s.daycareName)}</td><td>${s.day} ${s.start}~${s.end}</td><td>${escapeHtml(s.requesterName)}</td></tr>`).join("") +
      `</tbody></table>`;
  }

  function renderLeaves(t) {
    const leaves = getLeaves().filter(l => l.teacherId === t.id).sort((a, b) => (a.createdAt < b.createdAt ? 1 : -1));
    const holder = document.getElementById("leave_holder");
    if (leaves.length === 0) { holder.innerHTML = `<p class="small-muted">등록된 휴가/병가 이력이 없습니다.</p>`; return; }
    holder.innerHTML = `<table class="data-table"><thead><tr><th>종류</th><th>기간</th><th>사유</th><th>상태</th></tr></thead><tbody>` +
      leaves.map(l => `<tr><td>${escapeHtml(l.type)}</td><td>${escapeHtml(l.startDate)} ~ ${escapeHtml(l.endDate)}</td><td>${escapeHtml(l.reason || "-")}</td><td class="${l.status === "승인" ? "status-approved" : "status-pending"}">${escapeHtml(l.status)}</td></tr>`).join("") +
      `</tbody></table>`;
  }

  init();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>강사 리스트 - 원어민 강사 출강 관리</title>
<link rel="stylesheet" href="style.css">
<script src="common.js"></script>
</head>
<body>
<div id="page-wrap">
  <div id="head_bar_root"></div>

  <div class="panel">
    <h3 id="h_title"></h3>

    <div id="admin_add_box" style="display:none;">
      <div style="border:1px dashed #cbd5e1; border-radius:8px; padding:14px; margin-bottom:16px;">
        <div class="container-flex" style="gap:10px;">
          <div class="form-group" style="flex:1; min-width:150px;"><label>이름</label><input id="new_name" placeholder="예: John_존"></div>
          <div class="form-group" style="flex:1; min-width:150px;"><label>사는 곳</label><input id="new_location" placeholder="예: 송파구"></div>
          <div class="form-group" style="flex:1; min-width:150px;"><label>연락처</label><input id="new_phone" placeholder="010-0000-0000"></div>
        </div>
        <div class="container-flex" style="gap:10px;">
          <div class="form-group" style="flex:1; min-width:150px;">
            <label>비자</label>
            <select id="new_visa"><option value="">-- 선택 안 함 --</option></select>
          </div>
          <div class="form-group" style="flex:1; min-width:150px;"><label>입사일</label><input type="date" id="new_hire"></div>
          <div class="form-group" style="flex:1; min-width:150px;"><label>프로필 사진</label><input type="file" id="new_photo" accept="image/*"></div>
        </div>
        <button class="btn btn-primary" onclick="addTeacher()">강사 추가</button>
      </div>

      <div class="bulk-paste-box">
        <label style="font-weight:700; font-size:13px; display:block; margin-bottom:6px;">📋 엑셀에서 여러 명 한번에 붙여넣기 (이름 [Tab] 사는곳 [Tab] 연락처 [Tab] 비자 — 한 줄에 한 명씩)</label>
        <textarea id="bulk_text" placeholder="John_존	송파구	010-1234-5678	E-2&#10;Mary_메리	강남구	010-2222-3333	F-4"></textarea>
        <div class="bp-actions">
          <span class="small-muted">엑셀 표를 그대로 복사(Ctrl+C) 후 붙여넣기(Ctrl+V) 하세요.</span>
          <button class="btn btn-primary btn-sm" onclick="bulkAddTeachers()">일괄 등록</button>
        </div>
      </div>
    </div>

    <div class="search-bar">
      <input type="text" id="search_box" placeholder="이름, 사는 곳, 비자로 검색..." oninput="renderGrid()">
    </div>
    <div class="container-flex" style="justify-content:space-between; align-items:center; margin-bottom:10px;">
      <label class="small-muted" style="display:flex; align-items:center; gap:6px;">
        <input type="checkbox" id="show_resigned" onchange="renderGrid()"> 퇴사한 강사도 표시
      </label>
      <div id="bulk_delete_bar" style="display:none; gap:6px;" class="container-flex">
        <label class="small-muted" style="display:flex; align-items:center; gap:4px;">
          <input type="checkbox" id="select_all_teachers" onchange="toggleSelectAllTeachers()"> 전체선택
        </label>
        <button class="btn btn-danger btn-sm" onclick="bulkDeleteTeachers()">선택 삭제 (<span id="sel_count_t">0</span>)</button>
      </div>
    </div>

    <div id="teacher_grid" class="teacher-grid"></div>
  </div>
</div>

<!-- 수정 모달 -->
<div class="modal-bg" id="editModal">
  <div class="modal-box">
    <h3>강사 정보 수정</h3>
    <div class="form-group"><label>이름</label><input id="ed_name"></div>
    <div class="form-group"><label>사는 곳</label><input id="ed_location"></div>
    <div class="form-group"><label>연락처</label><input id="ed_phone"></div>
    <div class="form-group"><label>비자</label><select id="ed_visa"></select></div>
    <div class="container-flex" style="gap:10px;">
      <div class="form-group" style="flex:1;"><label>입사일</label><input type="date" id="ed_hire"></div>
      <div class="form-group" style="flex:1;"><label>재직 상태</label>
        <select id="ed_status"><option value="재직">재직</option><option value="퇴사">퇴사</option></select>
      </div>
    </div>
    <div class="form-group" id="ed_resign_wrap" style="display:none;"><label>퇴사일</label><input type="date" id="ed_resign"></div>
    <div class="form-group"><label>프로필 사진 변경</label><input type="file" id="ed_photo" accept="image/*"></div>

    <div class="form-group" style="border-top:1px solid #e2e8f0; padding-top:12px; margin-top:6px;">
      <label>강사 로그인 계정 (선택)</label>
      <p class="small-muted" id="login_status_hint" style="margin-bottom:6px;"></p>
      <input id="ed_login_pw" type="password" placeholder="비밀번호 (새로 만들거나 재설정할 때 입력)" style="height:36px; border:1px solid #cbd5e1; border-radius:6px; padding:0 8px; width:100%; margin-bottom:6px;">
      <div style="display:flex; gap:6px;">
        <button class="btn btn-ghost btn-sm" onclick="saveTeacherLogin()">계정 생성 / 비밀번호 재설정</button>
        <button class="btn btn-danger btn-sm" onclick="deleteTeacherLogin()">계정 삭제</button>
      </div>
      <p class="small-muted" style="margin-top:4px;">로그인은 강사 이름 + 비밀번호로 합니다. (강사 본인이 회원가입 페이지에서 직접 계정을 만들 수도 있습니다.)</p>
    </div>

    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeEdit()">취소</button>
      <button class="btn btn-primary" onclick="saveEdit()">저장</button>
    </div>
  </div>
</div>

<script>
  const me = requireStaff();
  let editingId = null;

  function visaOptionsHtml(includeBlank) {
    return (includeBlank ? `<option value="">-- 선택 안 함 --</option>` : "") + VISA_OPTIONS.map(v => `<option value="${v}">${v}</option>`).join("");
  }

  function init() {
    if (!me) return;
    renderHeadBar("teachers");
    document.getElementById("h_title").textContent = siteLabel("headings.teachers_list", "강사 리스트") + " (전체 열람 가능 · 수정은 관리자만)";
    document.getElementById("new_visa").innerHTML = visaOptionsHtml(true);
    document.getElementById("ed_visa").innerHTML = visaOptionsHtml(true);
    document.getElementById("ed_status").addEventListener("change", () => {
      document.getElementById("ed_resign_wrap").style.display = document.getElementById("ed_status").value === "퇴사" ? "block" : "none";
    });
    if (me.role === "admin") {
      document.getElementById("admin_add_box").style.display = "block";
      document.getElementById("bulk_delete_bar").style.display = "flex";
    }
    renderGrid();
  }

  let selectedTeacherIds = new Set();
  function toggleTeacherSelect(id, evt) {
    evt.stopPropagation();
    if (selectedTeacherIds.has(id)) selectedTeacherIds.delete(id); else selectedTeacherIds.add(id);
    document.getElementById("sel_count_t").textContent = selectedTeacherIds.size;
  }
  function toggleSelectAllTeachers() {
    const checked = document.getElementById("select_all_teachers").checked;
    const cards = document.querySelectorAll(".teacher-select-cb");
    selectedTeacherIds = new Set();
    cards.forEach(cb => { cb.checked = checked; if (checked) selectedTeacherIds.add(cb.dataset.id); });
    document.getElementById("sel_count_t").textContent = selectedTeacherIds.size;
  }
  function bulkDeleteTeachers() {
    if (selectedTeacherIds.size === 0) { alert("삭제할 강사를 선택해주세요."); return; }
    if (!confirm(`선택한 ${selectedTeacherIds.size}명의 강사를 삭제하시겠습니까? 로그인 계정도 함께 삭제됩니다.`)) return;
    saveTeachers(getTeachers().filter(t => !selectedTeacherIds.has(t.id)));
    selectedTeacherIds.forEach(id => removeTeacherLogin(id));
    selectedTeacherIds = new Set();
    document.getElementById("select_all_teachers").checked = false;
    renderGrid();
  }

  function fileToDataUrl(file) {
    return new Promise((resolve, reject) => {
      const r = new FileReader();
      r.onload = () => resolve(r.result);
      r.onerror = reject;
      r.readAsDataURL(file);
    });
  }

  async function addTeacher() {
    const name = document.getElementById("new_name").value.trim();
    if (!name) { alert("강사명을 입력해 주세요."); return; }
    const location = document.getElementById("new_location").value.trim();
    const phone = document.getElementById("new_phone").value.trim();
    const visa = document.getElementById("new_visa").value;
    const hireDate = document.getElementById("new_hire").value;
    const photoInput = document.getElementById("new_photo");

    let photo = "";
    try {
      if (photoInput.files[0]) photo = await fileToDataUrl(photoInput.files[0]);
      const list = getTeachers();
      list.push({ id: uid("t"), name, location, phone, visa, hireDate, resignDate: "", status: "재직", photo });
      saveTeachers(list);

      document.getElementById("new_name").value = "";
      document.getElementById("new_location").value = "";
      document.getElementById("new_phone").value = "";
      document.getElementById("new_visa").value = "";
      document.getElementById("new_hire").value = "";
      photoInput.value = "";
      renderGrid();
    } catch (e) {
      alert("사진 저장 중 오류가 발생했습니다. 파일 용량을 줄여서 다시 시도해주세요.");
    }
  }

  function bulkAddTeachers() {
    const text = document.getElementById("bulk_text").value;
    const rows = parseBulkRows(text);
    if (rows.length === 0) { alert("붙여넣은 내용이 없습니다."); return; }
    const list = getTeachers();
    let count = 0;
    rows.forEach(cols => {
      const name = (cols[0] || "").trim();
      if (!name) return;
      list.push({
        id: uid("t"), name,
        location: (cols[1] || "").trim(),
        phone: (cols[2] || "").trim(),
        visa: (cols[3] || "").trim(),
        hireDate: "", resignDate: "", status: "재직", photo: ""
      });
      count++;
    });
    saveTeachers(list);
    document.getElementById("bulk_text").value = "";
    renderGrid();
    alert(`${count}명의 강사가 일괄 등록되었습니다.`);
  }

  function deleteTeacher(id) {
    if (!confirm("해당 강사를 삭제하시겠습니까? 관련 스케줄 데이터는 별도로 관리됩니다.")) return;
    saveTeachers(getTeachers().filter(t => t.id !== id));
    removeTeacherLogin(id);
    renderGrid();
  }

  function openEdit(id, evt) {
    if (evt) evt.stopPropagation();
    const t = getTeachers().find(x => x.id === id);
    if (!t) return;
    editingId = id;
    document.getElementById("ed_name").value = t.name;
    document.getElementById("ed_location").value = t.location || "";
    document.getElementById("ed_phone").value = t.phone || "";
    document.getElementById("ed_visa").value = t.visa || "";
    document.getElementById("ed_hire").value = t.hireDate || "";
    document.getElementById("ed_status").value = t.status || "재직";
    document.getElementById("ed_resign").value = t.resignDate || "";
    document.getElementById("ed_resign_wrap").style.display = (t.status === "퇴사") ? "block" : "none";
    document.getElementById("ed_photo").value = "";
    document.getElementById("ed_login_pw").value = "";
    const loginUser = findUserByTeacherId(id);
    document.getElementById("login_status_hint").textContent = loginUser ? `✅ 로그인 계정 연결됨 (이름: ${loginUser.name})` : "등록된 로그인 계정이 없습니다.";
    document.getElementById("editModal").classList.add("open");
  }
  function closeEdit() { editingId = null; document.getElementById("editModal").classList.remove("open"); }

  function saveTeacherLogin() {
    const t = getTeachers().find(x => x.id === editingId);
    const pw = document.getElementById("ed_login_pw").value;
    const existing = findUserByTeacherId(editingId);
    if (!existing && !pw) { alert("새 계정을 만들려면 비밀번호를 입력해주세요."); return; }
    const loginId = existing ? existing.id : makeUniqueId(t.name);
    const ok = setTeacherLogin(editingId, loginId, pw, t.name);
    if (!ok) { alert("계정 저장 중 문제가 발생했습니다."); return; }
    document.getElementById("login_status_hint").textContent = `✅ 로그인 계정 연결됨 (이름: ${t.name})`;
    document.getElementById("ed_login_pw").value = "";
    alert("로그인 계정이 저장되었습니다.");
  }
  function deleteTeacherLogin() {
    if (!confirm("이 강사의 로그인 계정을 삭제하시겠습니까?")) return;
    removeTeacherLogin(editingId);
    document.getElementById("login_status_hint").textContent = "등록된 로그인 계정이 없습니다.";
  }

  async function saveEdit() {
    const list = getTeachers();
    const t = list.find(x => x.id === editingId);
    if (!t) return;
    t.name = document.getElementById("ed_name").value.trim() || t.name;
    t.location = document.getElementById("ed_location").value.trim();
    t.phone = document.getElementById("ed_phone").value.trim();
    t.visa = document.getElementById("ed_visa").value;
    t.hireDate = document.getElementById("ed_hire").value;
    t.status = document.getElementById("ed_status").value;
    t.resignDate = t.status === "퇴사" ? document.getElementById("ed_resign").value : "";

    try {
      const photoInput = document.getElementById("ed_photo");
      if (photoInput.files[0]) t.photo = await fileToDataUrl(photoInput.files[0]);
      saveTeachers(list);
      const loginUser = findUserByTeacherId(t.id);
      if (loginUser) { loginUser.name = t.name; saveUsers(getUsers().map(u => u.id === loginUser.id ? loginUser : u)); }
      closeEdit();
      renderGrid();
    } catch (e) {
      alert("사진 저장 중 오류가 발생했습니다. 파일 용량을 줄여서 다시 시도해주세요.");
    }
  }

  function renderGrid() {
    const query = document.getElementById("search_box").value;
    const showResigned = document.getElementById("show_resigned").checked;
    let list = getTeachers();
    if (!showResigned) list = list.filter(t => t.status !== "퇴사");
    list = list.filter(t => matchesQuery([t.name, t.location, t.phone, t.visa], query));

    const grid = document.getElementById("teacher_grid");
    const isAdmin = me.role === "admin";

    if (list.length === 0) {
      grid.innerHTML = `<p class="small-muted">${query ? "검색 결과가 없습니다." : "등록된 강사가 없습니다."}</p>`;
      return;
    }

    grid.innerHTML = list.map(t => {
      const photoHtml = t.photo
        ? `<img class="photo" src="${t.photo}">`
        : `<div class="photo no-img">사진 없음</div>`;

      const adminActions = isAdmin ? `
        <div class="card-actions">
          <button class="btn btn-ghost btn-sm" onclick="openEdit('${t.id}', event)">수정</button>
          <button class="btn btn-danger btn-sm" onclick="event.stopPropagation(); deleteTeacher('${t.id}')">삭제</button>
        </div>` : "";

      const selectCb = isAdmin ? `<input type="checkbox" class="teacher-select-cb" data-id="${t.id}" onclick="toggleTeacherSelect('${t.id}', event)" style="position:absolute; top:10px; left:10px; width:18px; height:18px;">` : "";

      const visaBadge = t.visa ? `<span class="visa-badge">${escapeHtml(t.visa)}</span>` : "";
      const resignBadge = t.status === "퇴사" ? `<span class="visa-badge" style="background:#fee2e2;color:#dc2626;">퇴사</span>` : "";

      return `
        <div class="teacher-card clickable-card" style="position:relative;" onclick="location.href='teacher_schedule.html?id=${t.id}'">
          ${selectCb}
          ${photoHtml}
          <h4>${escapeHtml(t.name)} ${visaBadge}${resignBadge}</h4>
          <div class="meta">🏠 ${escapeHtml(t.location || "미등록")}</div>
          <div class="meta">☎ ${escapeHtml(t.phone || "미등록")}</div>
          <div class="meta small-muted">클릭하면 스케줄 화면으로 이동</div>
          ${adminActions}
        </div>
      `;
    }).join("");
  }

  init();
</script>
</body>
</html>

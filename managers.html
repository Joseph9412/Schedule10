<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>담당자 - 원어민 강사 출강 관리</title>
<link rel="stylesheet" href="style.css">
<script src="common.js"></script>
</head>
<body>
<div id="page-wrap">
  <div id="head_bar_root"></div>

  <div class="panel">
    <h3 id="h_title"></h3>

    <div id="admin_add_box" style="display:none; border:1px dashed #cbd5e1; border-radius:8px; padding:14px; margin-bottom:16px;">
      <div class="container-flex" style="gap:10px;">
        <div class="form-group" style="flex:1; min-width:150px;"><label>이름</label><input id="new_name" placeholder="담당자 이름"></div>
        <div class="form-group" style="flex:1; min-width:150px;"><label>연락처</label><input id="new_phone" placeholder="010-0000-0000"></div>
        <div class="form-group" style="flex:2; min-width:200px;"><label>메모</label><input id="new_memo" placeholder="담당 지역, 참고사항 등"></div>
      </div>
      <button class="btn btn-primary" onclick="addManager()">담당자 추가</button>
    </div>

    <div class="search-bar">
      <input type="text" id="search_box" placeholder="담당자 이름, 연락처로 검색..." oninput="renderGrid()">
    </div>

    <div id="mgr_grid" class="teacher-grid"></div>
  </div>
</div>

<!-- 수정 모달 -->
<div class="modal-bg" id="editModal">
  <div class="modal-box">
    <h3>담당자 정보 수정</h3>
    <div class="form-group"><label>이름</label><input id="ed_name"></div>
    <div class="form-group"><label>연락처</label><input id="ed_phone"></div>
    <div class="form-group"><label>메모</label><input id="ed_memo"></div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeEdit()">취소</button>
      <button class="btn btn-primary" onclick="saveEdit()">저장</button>
    </div>
  </div>
</div>

<script>
  const me = requireStaff();
  let editingId = null;

  function init() {
    if (!me) return;
    renderHeadBar("managers");
    document.getElementById("h_title").textContent = siteLabel("headings.managers_list", "담당자 리스트");
    if (me.role === "admin") document.getElementById("admin_add_box").style.display = "block";
    renderGrid();
  }

  function addManager() {
    const name = document.getElementById("new_name").value.trim();
    if (!name) { alert("담당자 이름을 입력해 주세요."); return; }
    const list = getManagers();
    list.push({ id: uid("m"), name, phone: document.getElementById("new_phone").value.trim(), memo: document.getElementById("new_memo").value.trim(), createdAt: new Date().toISOString() });
    saveManagers(list);
    document.getElementById("new_name").value = "";
    document.getElementById("new_phone").value = "";
    document.getElementById("new_memo").value = "";
    renderGrid();
  }

  function deleteManager(id, evt) {
    evt.stopPropagation();
    const assigned = getDaycares().filter(d => d.managerId === id).length;
    const msg = assigned > 0
      ? `이 담당자에게 배정된 어린이집이 ${assigned}곳 있습니다. 삭제하면 해당 기관들은 '미지정' 상태가 됩니다. 계속하시겠습니까?`
      : "해당 담당자를 삭제하시겠습니까?";
    if (!confirm(msg)) return;
    saveManagers(getManagers().filter(m => m.id !== id));
    const daycares = getDaycares();
    daycares.forEach(d => { if (d.managerId === id) d.managerId = ""; });
    saveDaycares(daycares);
    renderGrid();
  }

  function openEdit(id, evt) {
    if (evt) evt.stopPropagation();
    const m = getManagers().find(x => x.id === id);
    if (!m) return;
    editingId = id;
    document.getElementById("ed_name").value = m.name;
    document.getElementById("ed_phone").value = m.phone || "";
    document.getElementById("ed_memo").value = m.memo || "";
    document.getElementById("editModal").classList.add("open");
  }
  function closeEdit() { editingId = null; document.getElementById("editModal").classList.remove("open"); }

  function saveEdit() {
    const list = getManagers();
    const m = list.find(x => x.id === editingId);
    const name = document.getElementById("ed_name").value.trim();
    if (!name) { alert("이름을 입력해주세요."); return; }
    m.name = name;
    m.phone = document.getElementById("ed_phone").value.trim();
    m.memo = document.getElementById("ed_memo").value.trim();
    saveManagers(list);
    closeEdit();
    renderGrid();
  }

  function renderGrid() {
    const query = document.getElementById("search_box").value;
    let list = getManagers().filter(m => matchesQuery([m.name, m.phone, m.memo], query));
    const grid = document.getElementById("mgr_grid");
    const isAdmin = me.role === "admin";

    if (list.length === 0) {
      grid.innerHTML = `<p class="small-muted">${query ? "검색 결과가 없습니다." : "등록된 담당자가 없습니다."}</p>`;
      return;
    }

    const daycareCountMap = {};
    getDaycares().forEach(d => { daycareCountMap[d.managerId] = (daycareCountMap[d.managerId] || 0) + 1; });

    grid.innerHTML = list.map(m => {
      const adminActions = isAdmin ? `
        <div class="card-actions">
          <button class="btn btn-ghost btn-sm" onclick="openEdit('${m.id}', event)">수정</button>
          <button class="btn btn-danger btn-sm" onclick="deleteManager('${m.id}', event)">삭제</button>
        </div>` : "";
      return `
        <div class="teacher-card clickable-card" onclick="location.href='manager_detail.html?id=${m.id}'">
          <div class="photo no-img" style="font-size:28px;">👤</div>
          <h4>${escapeHtml(m.name)}</h4>
          <div class="meta">☎ ${escapeHtml(m.phone || "미등록")}</div>
          <div class="meta">🏢 담당 기관 ${daycareCountMap[m.id] || 0}곳</div>
          <div class="meta small-muted">${escapeHtml(m.memo || "")}</div>
          <div class="meta small-muted">클릭하면 담당 어린이집/현황으로 이동</div>
          ${adminActions}
        </div>
      `;
    }).join("");
  }

  init();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>강사 일정관리 - 원어민 강사 출강 관리</title>
<link rel="stylesheet" href="style.css">
<script src="common.js"></script>
</head>
<body>
<div id="page-wrap">
  <div id="head_bar_root"></div>

  <div class="panel">
    <h3 id="cal_title"></h3>
    <p class="small-muted" style="margin-bottom:14px;">강사들의 휴가/병가/월차 및 입사·퇴사 일정을 한눈에 확인합니다. 이 캘린더는 요일 기준이 아닌 <b>실제 날짜</b> 기준이며, 스케줄표(요일 기준 반복 수업)는 자동으로 연동되지 않으니 휴가 기간에는 보강/대체 페이지에서 별도로 확인해주세요.</p>

    <div class="container-flex" style="gap:16px; align-items:flex-start;">
      <div style="flex:2; min-width:320px;">
        <div class="container-flex" style="gap:10px; align-items:center; margin-bottom:10px;">
          <button class="btn btn-ghost btn-sm" onclick="shiftMonth(-1)">‹ 이전달</button>
          <h4 id="month_label" style="min-width:120px; text-align:center;"></h4>
          <button class="btn btn-ghost btn-sm" onclick="shiftMonth(1)">다음달 ›</button>
        </div>
        <div id="calendar_holder"></div>
        <div id="date_detail_holder" style="margin-top:14px;"></div>
      </div>

      <div style="flex:1; min-width:280px;">
        <div id="admin_add_box" style="display:none;" class="settings-section">
          <h4>일정 직접 등록 (관리자)</h4>
          <div class="form-group"><label>강사</label><select id="ev_teacher"></select></div>
          <div class="form-group"><label>종류</label>
            <select id="ev_type"></select>
          </div>
          <div class="container-flex" style="gap:8px;">
            <div class="form-group" style="flex:1;"><label>시작일</label><input type="date" id="ev_start"></div>
            <div class="form-group" style="flex:1;"><label>종료일</label><input type="date" id="ev_end"></div>
          </div>
          <div class="form-group"><label>사유/메모</label><input id="ev_reason"></div>
          <button class="btn btn-primary" style="width:100%;" onclick="addEventDirect()">등록 (자동 승인)</button>
        </div>

        <div style="margin-top:16px;">
          <h4 style="margin-bottom:8px;">승인 대기 중인 요청</h4>
          <div id="pending_leaves"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="panel" style="margin-top:20px;">
    <h3>전체 일정 목록</h3>
    <div class="search-bar"><input type="text" id="search_box" placeholder="강사명으로 검색..." oninput="renderList()"></div>
    <div id="leave_list_holder"></div>
  </div>
</div>

<script>
  const me = requireStaff();
  let viewYear, viewMonth; // viewMonth: 0-indexed
  let selectedDate = null;
  const MAX_CHIPS = 3;

  function init() {
    if (!me) return;
    renderHeadBar("calendar");
    document.getElementById("cal_title").textContent = siteLabel("headings.calendar_title", DEFAULT_SITE_SETTINGS.headings.calendar_title);
    const now = new Date();
    viewYear = now.getFullYear(); viewMonth = now.getMonth();
    document.getElementById("ev_teacher").innerHTML = getTeachers().map(t => `<option value="${t.id}">${escapeHtml(t.name)}</option>`).join("");
    document.getElementById("ev_type").innerHTML = LEAVE_TYPES.map(t => `<option value="${t}">${t}</option>`).join("");
    if (me.role === "admin") document.getElementById("admin_add_box").style.display = "block";
    renderCalendar();
    renderPendingLeaves();
    renderList();
  }

  function shiftMonth(delta) {
    viewMonth += delta;
    if (viewMonth < 0) { viewMonth = 11; viewYear--; }
    if (viewMonth > 11) { viewMonth = 0; viewYear++; }
    renderCalendar();
  }

  function dateStr(y, m, d) {
    const pad = n => String(n).padStart(2, "0");
    return `${y}-${pad(m + 1)}-${pad(d)}`;
  }

  function eventsOnDate(ds) {
    return getLeaves().filter(l => l.status === "승인" && l.startDate <= ds && ds <= l.endDate);
  }

  function renderCalendar() {
    document.getElementById("month_label").textContent = `${viewYear}년 ${viewMonth + 1}월`;
    const firstDay = new Date(viewYear, viewMonth, 1).getDay();
    const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();
    const todayStr = dateStr(new Date().getFullYear(), new Date().getMonth(), new Date().getDate());

    let html = `<table class="data-table" style="table-layout:fixed;"><thead><tr>` +
      ["일","월","화","수","목","금","토"].map(d => `<th>${d}</th>`).join("") + `</tr></thead><tbody><tr>`;

    for (let i = 0; i < firstDay; i++) html += `<td style="background:#f8fafc;"></td>`;
    let col = firstDay;
    for (let d = 1; d <= daysInMonth; d++) {
      if (col === 7) { html += `</tr><tr>`; col = 0; }
      const ds = dateStr(viewYear, viewMonth, d);
      const evts = eventsOnDate(ds);
      const isToday = ds === todayStr;
      const isSelected = ds === selectedDate;
      const typeColor = { "휴가": "#0ea5e9", "병가": "#ef4444", "퇴사": "#64748b", "기타": "#a855f7" };
      const shown = evts.slice(0, MAX_CHIPS);
      const extra = evts.length - shown.length;
      const chips = shown.map(e => `<div style="font-size:10.5px; background:${typeColor[e.type] || '#94a3b8'}1a; color:${typeColor[e.type] || '#475569'}; border-radius:4px; padding:1px 4px; margin-top:2px; text-align:left; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;" title="${escapeHtml(e.teacherName)} ${escapeHtml(e.type)}">${escapeHtml(e.teacherName)} · ${escapeHtml(e.type)}</div>`).join("");
      const moreLink = extra > 0 ? `<div style="font-size:10.5px; color:#2563eb; font-weight:700; margin-top:2px; cursor:pointer;">+${extra}개 더보기</div>` : "";
      html += `<td style="vertical-align:top; height:70px; cursor:pointer; ${isToday ? 'background:#eff6ff;' : ''} ${isSelected ? 'outline:2px solid #2563eb; outline-offset:-2px;' : ''}" onclick="selectDate('${ds}')"><div style="font-weight:700; font-size:12px; ${isToday ? 'color:#2563eb;' : ''}">${d}</div>${chips}${moreLink}</td>`;
      col++;
    }
    while (col < 7) { html += `<td></td>`; col++; }
    html += `</tr></tbody></table>`;
    document.getElementById("calendar_holder").innerHTML = html;
    renderDateDetail();
  }

  function selectDate(ds) {
    selectedDate = (selectedDate === ds) ? null : ds;
    renderCalendar();
  }

  function renderDateDetail() {
    const holder = document.getElementById("date_detail_holder");
    if (!selectedDate) { holder.innerHTML = ""; return; }
    const evts = eventsOnDate(selectedDate);
    if (evts.length === 0) {
      holder.innerHTML = `<div class="panel" style="background:#f8fafc;"><p class="small-muted">${escapeHtml(selectedDate)} — 등록된 일정이 없습니다.</p></div>`;
      return;
    }
    holder.innerHTML = `<div class="panel" style="background:#f8fafc;">
      <h4 style="margin-bottom:10px;">📅 ${escapeHtml(selectedDate)} 일정 (${evts.length}건)</h4>
      ${evts.map(e => `
        <div class="note-item">
          <div class="note-head"><span><b>${escapeHtml(e.teacherName)}</b> · ${escapeHtml(e.type)}</span></div>
          <div class="note-text">${escapeHtml(e.startDate)} ~ ${escapeHtml(e.endDate)}${e.reason ? " · " + escapeHtml(e.reason) : ""}</div>
        </div>
      `).join("")}
    </div>`;
  }

  function addEventDirect() {
    const teacherId = document.getElementById("ev_teacher").value;
    const teacher = getTeachers().find(t => t.id === teacherId);
    const type = document.getElementById("ev_type").value;
    const startDate = document.getElementById("ev_start").value;
    const endDate = document.getElementById("ev_end").value || startDate;
    const reason = document.getElementById("ev_reason").value.trim();
    if (!teacherId || !startDate) { alert("강사와 시작일을 입력해주세요."); return; }

    const leaves = getLeaves();
    leaves.push({ id: uid("lv"), teacherId, teacherName: teacher.name, type, startDate, endDate, reason, status: "승인", createdAt: new Date().toISOString(), requestedBy: me.name });
    saveLeaves(leaves);
    applyLeaveEffect(teacherId, type, startDate);

    document.getElementById("ev_start").value = ""; document.getElementById("ev_end").value = ""; document.getElementById("ev_reason").value = "";
    renderCalendar(); renderList();
    alert("일정이 등록되었습니다.");
  }

  function applyLeaveEffect(teacherId, type, startDate) {
    if (type === "퇴사") {
      const list = getTeachers();
      const t = list.find(x => x.id === teacherId);
      if (t) { t.status = "퇴사"; t.resignDate = startDate; saveTeachers(list); }
    }
  }

  function approveLeave(id) {
    const leaves = getLeaves();
    const target = leaves.find(l => l.id === id);
    target.status = "승인";
    saveLeaves(leaves);
    applyLeaveEffect(target.teacherId, target.type, target.startDate);
    renderCalendar(); renderPendingLeaves(); renderList(); renderHeadBar("calendar");
  }
  function rejectLeave(id) {
    if (!confirm("해당 요청을 거절하시겠습니까?")) return;
    const leaves = getLeaves();
    const target = leaves.find(l => l.id === id);
    target.status = "거절";
    saveLeaves(leaves);
    renderPendingLeaves(); renderList(); renderHeadBar("calendar");
  }
  function deleteLeave(id) {
    if (!confirm("해당 일정을 삭제하시겠습니까?")) return;
    saveLeaves(getLeaves().filter(l => l.id !== id));
    renderCalendar(); renderPendingLeaves(); renderList();
  }

  function renderPendingLeaves() {
    const pending = sortByUpcoming(getLeaves().filter(l => l.status === "대기"), "startDate");
    const holder = document.getElementById("pending_leaves");
    const isAdmin = me.role === "admin";
    if (pending.length === 0) { holder.innerHTML = `<p class="small-muted">대기 중인 요청이 없습니다.</p>`; return; }
    holder.innerHTML = pending.map(l => `
      <div class="note-item">
        <div class="note-head"><span><b>${escapeHtml(l.teacherName)}</b> · ${escapeHtml(l.type)}</span></div>
        <div class="note-text">${escapeHtml(l.startDate)} ~ ${escapeHtml(l.endDate)}${l.reason ? " · " + escapeHtml(l.reason) : ""}</div>
        ${isAdmin ? `<div style="margin-top:8px; display:flex; gap:6px;">
          <button class="btn btn-success btn-sm" onclick="approveLeave('${l.id}')">승인</button>
          <button class="btn btn-danger btn-sm" onclick="rejectLeave('${l.id}')">거절</button>
        </div>` : ""}
      </div>
    `).join("");
  }

  function renderList() {
    const query = document.getElementById("search_box").value;
    const list = sortByUpcoming(getLeaves().filter(l => matchesQuery([l.teacherName], query)), "startDate");
    const holder = document.getElementById("leave_list_holder");
    const isAdmin = me.role === "admin";
    if (list.length === 0) { holder.innerHTML = `<p class="small-muted">등록된 일정이 없습니다.</p>`; return; }
    holder.innerHTML = `<table class="data-table"><thead><tr><th>강사</th><th>종류</th><th>기간</th><th>사유</th><th>상태</th>${isAdmin ? "<th>관리</th>" : ""}</tr></thead><tbody>` +
      list.map(l => `<tr>
        <td>${escapeHtml(l.teacherName)}</td><td>${escapeHtml(l.type)}</td>
        <td>${escapeHtml(l.startDate)} ~ ${escapeHtml(l.endDate)}</td>
        <td>${escapeHtml(l.reason || "-")}</td>
        <td class="${l.status === "승인" ? "status-approved" : (l.status === "거절" ? "" : "status-pending")}">${escapeHtml(l.status)}</td>
        ${isAdmin ? `<td><button class="btn btn-danger btn-sm" onclick="deleteLeave('${l.id}')">삭제</button></td>` : ""}
      </tr>`).join("") + `</tbody></table>`;
  }

  init();
</script>
</body>
</html>
